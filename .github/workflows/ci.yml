name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test tools
        run: python -m pip install ".[test]"
      - name: Run the tests
        run: python -m pytest -q

  reproduce:
    name: Re-count the UN test set with two tokenisers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[test]"
      - name: Network tests
        env:
          ARABIC_TOKEN_TAX_NETWORK: "1"
        run: python -m pytest -q tests/test_network.py
      - name: Fetch the UN test set, count and compare with the release
        run: |
          arabic-token-tax fetch --data "$RUNNER_TEMP/data" --slices unpc_test2015
          arabic-token-tax run --config config/tokenisers.yaml --prices "" --data "$RUNNER_TEMP/data" \
            --out "$RUNNER_TEMP/out" --only o200k_base,qwen3.5 --resamples 200
          arabic-token-tax compare "$RUNNER_TEMP/out" results/v0.1.0
